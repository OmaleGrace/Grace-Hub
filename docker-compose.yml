services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: predict
      POSTGRES_PASSWORD: predict_dev_password
      POSTGRES_DB: predictions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata: