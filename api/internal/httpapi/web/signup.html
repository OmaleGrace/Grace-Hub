<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Predictions</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/">Predictions</a></h1>
    <nav id="nav"></nav>
  </header>
  <main>
    <form id="signup-form" class="auth-form">
      <h2>Create an account</h2>
      <label>Username
        <input name="username" required pattern="[A-Za-z0-9_]{3,30}"
               title="3-30 letters, numbers or underscores" autocomplete="username">
      </label>
      <label>Email
        <input name="email" type="email" required autocomplete="email">
      </label>
      <label>Password
        <input name="password" type="password" required minlength="8" maxlength="72"
               autocomplete="new-password">
      </label>
      <button type="submit">Create account</button>
      <p id="message" class="error" role="status"></p>
      <p class="alt">Already have an account? <a href="/login">Log in</a></p>
    </form>
  </main>
  <script src="/common.js"></script>
  <script src="/signup.js"></script>
</body>
</html>
